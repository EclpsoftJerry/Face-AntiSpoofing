version: "3.9"

services:
  app:
    build: .
    container_name: face_antispoofing_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app  # ← Para desarrollo, te permite ver los cambios sin rebuild

  db:
    image: postgres:16
    container_name: postgres_auditoria
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: auditoria_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
